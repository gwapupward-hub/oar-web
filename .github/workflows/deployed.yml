name: Production smoke
# Vercel reports every deployment to GitHub. Once a production deployment succeeds, run the live devnet smoke test
# against the production URL, waiting until it serves the deployed commit. No secrets: it reads public pages only.
on:
  deployment_status:
permissions:
  contents: read
defaults:
  run:
    shell: bash
# Grouped by environment, so a preview deployment's event cannot cancel a running production smoke.
concurrency:
  group: production-smoke-${{ github.event.deployment.environment }}
  cancel-in-progress: true
jobs:
  smoke:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Live devnet smoke against production
        env:
          # The official domain. The OAR_WEB_PRODUCTION_URL repository variable overrides it.
          BASE_URL: ${{ vars.OAR_WEB_PRODUCTION_URL || 'https://oarprotocol.xyz' }}
          EXPECT_COMMIT: ${{ github.event.deployment.sha }}
        run: npm run smoke:devnet
