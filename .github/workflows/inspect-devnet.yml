name: Inspect a devnet address
# Manual, read-only report on one devnet address: an OAR App ID (record, manifest, claims, and every program its
# transactions called) or a wallet (the App IDs it registered). No secrets; it only reads public chain data.
on:
  workflow_dispatch:
    inputs:
      address:
        description: App ID or wallet address (base58)
        required: true
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Inspect
        env:
          ADDRESS: ${{ inputs.address }}
          OAR_DEVNET_RPC_URL: ${{ vars.OAR_DEVNET_RPC_URL }}
          REPORT_JSON: inspect-report.json
        run: node scripts/inspect-devnet.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: inspect-report
          path: inspect-report.json
          if-no-files-found: ignore
